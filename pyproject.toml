[project]
name = "priorpull"
version = "0.1.0"
description = "Measuring how priors and question framing steer LLM experiment-search advice"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anthropic>=1.0",
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "matplotlib",
  "python-dotenv",
  "baybe",
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priorpull"]
